# =============================================================================
# CI - Veracode (Bitbucket Pipelines)
#
# Rename this file to bitbucket-pipelines.yml in your repository root.
#
# Repository variables (Repository settings > Pipelines > Repository variables):
#   VERACODE_API_ID     Veracode API ID          (Secured)
#   VERACODE_API_KEY    Veracode API Key         (Secured)
# Optional:
#   SRCCLR_API_TOKEN    Agent-based SCA token    (Secured)
#   VERACODE_APP_NAME   Application profile name (default: {workspace}/{repo})
#
# Scan selection (native start conditions, "triggers:" at the bottom):
#   push to default branch       -> veracode-policy   (Policy Scan)
#   push to feature/**           -> veracode-feature  (Pipeline Scan, fails on any flaw)
#   PR targeting default branch  -> veracode-pr       (Pipeline Scan, policy gate)
#   all of the above             -> Agent-based SCA (non-blocking)
#
# Bitbucket does not expose the default branch as a variable. If yours is not
# "main", update the two conditions in "triggers:".
# =============================================================================

image: maven:3.9-eclipse-temurin-17

definitions:
  steps:
    # -------------------------------------------------------------------------
    # PACKAGE: Veracode CLI autopackager
    # -------------------------------------------------------------------------
    - step: &package
        name: Package Artifacts
        script:
          - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
          - curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          - ./veracode version
          - mkdir -p verascan
          - ./veracode package --source . --output verascan --trust
          - ls -lhR verascan
          - find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
          - |
            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: No packaged artifacts found"
              exit 1
            fi
            echo "Artifacts found ($(wc -l < artifact_list.txt)):"
            cat artifact_list.txt
        artifacts:
          - verascan/**
          - artifact_list.txt

    # -------------------------------------------------------------------------
    # SCA: Agent-based SCA (non-blocking)
    # -------------------------------------------------------------------------
    - step: &sca
        name: Agent-Based SCA
        script:
          # Same computation as the policy scan profile
          - APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"
          - curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- scan --recursive --update-advisor --appname "$APP_NAME" || echo "SCA scan completed"

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (feature): no fail criteria, every flaw counts
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-feature
        name: Pipeline Scan (feature)
        script:
          - GATE_POLICY=""
          - echo "Gate - fail on any flaw"
          - &pipeline_scan_loop |
            apt-get update -qq && apt-get install -y -qq unzip >/dev/null
            curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
            unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

            mkdir -p scan_results
            FAILED=0
            FAILED_ARTIFACTS=""

            while IFS= read -r artifact; do
              NAME=$(basename "$artifact")
              echo "=========================================="
              echo "Scanning: $NAME"
              echo "=========================================="

              set +e
              if [ -n "$GATE_POLICY" ]; then
                java -jar pipeline-scan.jar -f "$artifact" \
                  -vid "$VERACODE_API_ID" -vkey "$VERACODE_API_KEY" \
                  --issue_details true --policy_name "$GATE_POLICY"
              else
                java -jar pipeline-scan.jar -f "$artifact" \
                  -vid "$VERACODE_API_ID" -vkey "$VERACODE_API_KEY" \
                  --issue_details true
              fi
              RC=$?
              set -e

              # 0 = pass, 1-200 = flaw count, 253-255 = error or timeout
              if [ "$RC" -ge 253 ]; then
                echo "ERROR: Scan error for $NAME (exit $RC)"
                FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              elif [ "$RC" -ne 0 ]; then
                echo "ERROR: $RC flaw(s) failed the gate for $NAME"
                FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              fi

              if [ -f results.json ]; then
                mv results.json "scan_results/${NAME}_results.json"
              fi
            done < artifact_list.txt

            if [ "$FAILED" -eq 1 ]; then
              echo "ERROR: Pipeline Scan failed for:$FAILED_ARTIFACTS"
              exit 1
            fi
        artifacts:
          - scan_results/**

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (PR): evaluate findings against a Veracode policy
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-pr
        name: Pipeline Scan (PR gate)
        script:
          - GATE_POLICY="Veracode Recommended Very High"
          - echo "Gate - policy $GATE_POLICY"
          - *pipeline_scan_loop
        artifacts:
          - scan_results/**

    # -------------------------------------------------------------------------
    # POLICY SCAN: push to default branch
    # -------------------------------------------------------------------------
    - step: &policy-scan
        name: Policy Scan
        script:
          - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
          - BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
          - curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
          - VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
          - |
            if [ -z "$VERSION" ]; then
              echo "ERROR: Failed to resolve API Wrapper version"
              exit 1
            fi
            echo "API Wrapper version: $VERSION"
          - curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
          - unzip -o dist.zip -d .veracode
          - JAR=$(find .veracode -type f -name 'VeracodeJavaAPI*.jar' | head -n1)
          - |
            if [ -z "$JAR" ]; then
              echo "ERROR: VeracodeJavaAPI.jar not found"
              exit 1
            fi
            cp "$JAR" VeracodeJavaAPI.jar
          - APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"
          - echo "Veracode Application Profile - $APP_NAME"
          - |
            java -jar VeracodeJavaAPI.jar \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              -action UploadAndScan \
              -appname "$APP_NAME" \
              -createprofile true \
              -autoscan true \
              -filepath verascan \
              -version "${BITBUCKET_BRANCH}-${BITBUCKET_BUILD_NUMBER}-$(date +%Y%m%d%H%M%S)"

# =============================================================================
# PIPELINES (custom, started by the triggers below)
# =============================================================================
pipelines:
  custom:
    veracode-policy:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *policy-scan

    veracode-feature:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *pipeline-scan-feature

    veracode-pr:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *pipeline-scan-pr

# =============================================================================
# TRIGGERS (start conditions)
# =============================================================================
triggers:
  repository-push:
    - condition: BITBUCKET_BRANCH == "main"
      pipelines:
        - veracode-policy
    - condition: glob(BITBUCKET_BRANCH, "feature/**")
      pipelines:
        - veracode-feature
  pullrequest-push:
    - condition: BITBUCKET_PR_DESTINATION_BRANCH == "main"
      pipelines:
        - veracode-pr
