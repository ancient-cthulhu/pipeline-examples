# =============================================================================
# CI - Veracode (Bitbucket Pipelines)
#
# Renombra este archivo a bitbucket-pipelines.yml en la raiz del repositorio.
#
# Variables del repositorio:
# Repository settings > Pipelines > Repository variables
#
#   VERACODE_API_ID     Veracode API ID          (Secured)
#   VERACODE_API_KEY    Veracode API Key         (Secured)
#
# Opcionales:
#   SRCCLR_API_TOKEN
#     Token de SCA basado en agente              (Secured)
#
#   VERACODE_APP_NAME
#     Nombre del perfil de aplicacion
#     Valor predeterminado: {workspace}/{repo}
#
#   VERACODE_BUSINESS_CRITICALITY
#     Solo se usa al crear el perfil
#     Valor predeterminado: VeryHigh
#
# Seleccion de escaneos:
#
#   Push a main:
#     - Escaneo IaC y secretos
#     - SCA basado en agente
#     - Policy Scan
#
#   Push a cualquier otra rama:
#     - Escaneo IaC y secretos
#     - SCA basado en agente
#     - Pipeline Scan, reporta cualquier hallazgo, no bloqueante
#
#   Pull request dirigido a main:
#     - Escaneo IaC y secretos
#     - SCA basado en agente
#     - Pipeline Scan con gate de politica
#
# Bitbucket no expone la rama predeterminada como variable. Si la rama
# predeterminada no es "main", actualiza:
#
#   1. El selector "main:" en la seccion branches
#   2. BITBUCKET_PR_DESTINATION_BRANCH en la condicion del trigger
# =============================================================================

image: maven:3.9-eclipse-temurin-17

definitions:
  steps:
    # -------------------------------------------------------------------------
    # PACKAGE: Autopackager de Veracode CLI
    # -------------------------------------------------------------------------
    - step: &package
        name: Empaquetar Artefactos
        script:
          - apt-get update -qq
          - apt-get install -y -qq curl unzip >/dev/null

          - mkdir -p /opt/veracode-cli

          - |
            cd /opt/veracode-cli
            curl -fsS "https://tools.veracode.com/veracode-cli/install" | sh

          - export PATH="/opt/veracode-cli:$PATH"
          - veracode version

          - mkdir -p verascan

          - |
            veracode package \
              --source . \
              --output verascan \
              --trust

          - ls -lhR verascan

          - |
            find verascan \
              -type f \
              \( \
                -name "*.war" \
                -o -name "*.jar" \
                -o -name "*.ear" \
                -o -name "*.zip" \
                -o -name "*.apk" \
                -o -name "*.ipa" \
              \) \
              | sort > artifact_list.txt

          - |
            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: No se encontraron artefactos empaquetados"
              exit 1
            fi

            ARTIFACT_COUNT=$(wc -l < artifact_list.txt)

            echo "Artefactos encontrados: $ARTIFACT_COUNT"
            cat artifact_list.txt

        artifacts:
          - verascan/**
          - artifact_list.txt

    # -------------------------------------------------------------------------
    # ESCANEO IaC Y SECRETOS
    #
    # El escaneo de tipo directory revisa el repositorio para detectar:
    #   - Errores de configuracion de Infrastructure as Code
    #   - Secretos expuestos
    # -------------------------------------------------------------------------
    - step: &iac-scan
        name: Escaneo IaC y Secretos
        on-fail:
          strategy: ignore
        script:
          - apt-get update -qq
          - apt-get install -y -qq curl >/dev/null

          - mkdir -p /opt/veracode-cli

          - |
            cd /opt/veracode-cli
            curl -fsS "https://tools.veracode.com/veracode-cli/install" | sh

          - export PATH="/opt/veracode-cli:$PATH"
          - veracode version

          - |
            if [ -z "${VERACODE_API_ID:-}" ]; then
              echo "ERROR: VERACODE_API_ID no esta configurado"
              exit 1
            fi

            if [ -z "${VERACODE_API_KEY:-}" ]; then
              echo "ERROR: VERACODE_API_KEY no esta configurado"
              exit 1
            fi

          - |
            export VERACODE_API_KEY_ID="$VERACODE_API_ID"
            export VERACODE_API_KEY_SECRET="$VERACODE_API_KEY"

            echo "Iniciando escaneo IaC y secretos"
            echo "Origen: directorio de trabajo del repositorio"

            veracode scan \
              --source . \
              --type directory \
              --format table

    # -------------------------------------------------------------------------
    # SCA: SCA basado en agente
    #
    # Este step es no bloqueante. Si el escaneo falla, Bitbucket lo muestra
    # como Failed (Ignored), pero permite que el pipeline continue.
    # -------------------------------------------------------------------------
    - step: &sca
        name: SCA Basado en Agente
        on-fail:
          strategy: ignore
        script:
          - |
            if [ -z "${SRCCLR_API_TOKEN:-}" ]; then
              echo "ERROR: SRCCLR_API_TOKEN no esta configurado"
              exit 1
            fi

          - |
            curl -sSL "https://sca-downloads.veracode.com/ci.sh" |
              bash -s -- scan --recursive --update-advisor

    # -------------------------------------------------------------------------
    # PIPELINE SCAN PARA RAMAS
    #
    # No especifica una politica. Por lo tanto, cualquier hallazgo reportado
    # hace que el comando de Pipeline Scan devuelva un codigo diferente de 0.
    #
    # Este step es no bloqueante:
    #   - Bitbucket muestra Failed (Ignored)
    #   - El pipeline de la rama puede permanecer verde
    #   - El Pipeline Scan del PR actua como gate de merge
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-branch
        name: Pipeline Scan (rama)
        on-fail:
          strategy: ignore
        script:
          - |
            GATE_POLICY=""
            echo "Gate: falla con cualquier hallazgo"

          - &pipeline_scan_loop |
            apt-get update -qq
            apt-get install -y -qq curl unzip >/dev/null

            curl -fsSO \
              "https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip"

            unzip -o \
              pipeline-scan-LATEST.zip \
              pipeline-scan.jar

            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: artifact_list.txt no existe o esta vacio"
              exit 1
            fi

            mkdir -p scan_results

            FAILED=0
            FAILED_ARTIFACTS=""

            while IFS= read -r artifact; do
              NAME=$(basename "$artifact")
              SAFE_NAME=$(printf '%s' "$NAME" | tr '/ ' '__')

              echo "=========================================="
              echo "Escaneando: $NAME"
              echo "Artefacto: $artifact"
              echo "=========================================="

              if [ ! -f "$artifact" ]; then
                echo "ERROR: El artefacto no existe: $artifact"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                continue
              fi

              rm -f results.json

              set +e

              if [ -n "$GATE_POLICY" ]; then
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  --policy_name "$GATE_POLICY" \
                  < /dev/null
              else
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  < /dev/null
              fi

              RC=$?

              set -e

              # Codigos de salida de Pipeline Scan:
              #   0       = escaneo aprobado
              #   1-200   = cantidad de hallazgos que fallaron el gate
              #   253-255 = error de escaneo, solicitud invalida o timeout
              if [ "$RC" -ge 253 ]; then
                echo "ERROR: Error de escaneo en $NAME; codigo de salida: $RC"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              elif [ "$RC" -ne 0 ]; then
                echo "ERROR: $RC hallazgo(s) fallaron el gate en $NAME"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              else
                echo "Pipeline Scan aprobado para $NAME"
              fi

              if [ -f results.json ]; then
                mv \
                  results.json \
                  "scan_results/${SAFE_NAME}_results.json"
              fi
            done < artifact_list.txt

            if [ "$FAILED" -eq 1 ]; then
              echo "ERROR: Pipeline Scan fallo para:$FAILED_ARTIFACTS"
              exit 1
            fi

            echo "Todos los Pipeline Scans finalizaron correctamente"

        artifacts:
          upload:
            - name: pipeline-scan-results-branch
              type: scoped
              capture-on: always
              paths:
                - scan_results/**

    # -------------------------------------------------------------------------
    # PIPELINE SCAN PARA PULL REQUESTS
    #
    # Evalua los hallazgos contra la politica indicada.
    # Este step es bloqueante y actua como gate del pull request.
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-pr
        name: Pipeline Scan (gate PR)
        script:
          - |
            GATE_POLICY="Veracode Recommended Very High"
            echo "Gate: politica '$GATE_POLICY'"

          - *pipeline_scan_loop

        artifacts:
          upload:
            - name: pipeline-scan-results-pr
              type: scoped
              capture-on: always
              paths:
                - scan_results/**

    # -------------------------------------------------------------------------
    # POLICY SCAN
    #
    # Se ejecuta despues de un push a la rama main.
    #
    # Este step:
    #   - Obtiene la version mas reciente del Veracode Java API Wrapper
    #   - Crea el perfil de aplicacion si no existe
    #   - Carga los artefactos del directorio verascan
    #   - Inicia un Policy Scan
    # -------------------------------------------------------------------------
    - step: &policy-scan
        name: Policy Scan
        script:
          - apt-get update -qq
          - apt-get install -y -qq curl unzip >/dev/null

          - |
            BASE="https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java"

            curl -fsS \
              "$BASE/maven-metadata.xml" \
              -o maven-metadata.xml

          - |
            VERSION=$(
              grep -oPm1 "(?<=<latest>)[^<]+" \
                maven-metadata.xml
            )

            if [ -z "$VERSION" ]; then
              echo "ERROR: No se pudo resolver la version del API Wrapper"
              exit 1
            fi

            echo "Version del API Wrapper: $VERSION"

          - |
            curl -fsSL \
              "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" \
              -o dist.zip

          - unzip -o dist.zip -d .veracode

          - |
            JAR=$(
              find .veracode \
                -type f \
                -name 'VeracodeJavaAPI*.jar' \
                | head -n1
            )

            if [ -z "$JAR" ]; then
              echo "ERROR: No se encontro VeracodeJavaAPI.jar"
              exit 1
            fi

            cp "$JAR" VeracodeJavaAPI.jar

          - |
            if [ ! -d verascan ]; then
              echo "ERROR: No se restauro el directorio verascan"
              exit 1
            fi

            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: No se restauro artifact_list.txt o esta vacio"
              exit 1
            fi

          - |
            APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"

            echo "Perfil de aplicacion Veracode: $APP_NAME"
            echo "Criticidad: ${VERACODE_BUSINESS_CRITICALITY:-VeryHigh}"

          - |
            SCAN_VERSION="${BITBUCKET_BRANCH}-${BITBUCKET_BUILD_NUMBER}-$(date +%Y%m%d%H%M%S)"

            echo "Version del Policy Scan: $SCAN_VERSION"

            java -jar VeracodeJavaAPI.jar \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              -action UploadAndScan \
              -appname "$APP_NAME" \
              -createprofile true \
              -criticality "${VERACODE_BUSINESS_CRITICALITY:-VeryHigh}" \
              -filepath verascan \
              -version "$SCAN_VERSION"

# =============================================================================
# PIPELINES
# =============================================================================

pipelines:
  # ---------------------------------------------------------------------------
  # Push a la rama main
  #
  # Primero empaqueta. Despues ejecuta en paralelo:
  #   - Escaneo IaC y secretos
  #   - SCA basado en agente
  #   - Policy Scan
  # ---------------------------------------------------------------------------
  branches:
    main:
      - step: *package

      - parallel:
          steps:
            - step: *iac-scan
            - step: *sca
            - step: *policy-scan

  # ---------------------------------------------------------------------------
  # Push a cualquier otra rama
  #
  # "default" excluye los push de tags.
  #
  # Primero empaqueta. Despues ejecuta en paralelo:
  #   - Escaneo IaC y secretos
  #   - SCA basado en agente
  #   - Pipeline Scan no bloqueante
  # ---------------------------------------------------------------------------
  default:
    - step: *package

    - parallel:
        steps:
          - step: *iac-scan
          - step: *sca
          - step: *pipeline-scan-branch

  # ---------------------------------------------------------------------------
  # Pull request dirigido a main
  #
  # Este custom pipeline es iniciado por el trigger pullrequest-push.
  # ---------------------------------------------------------------------------
  custom:
    veracode-pr:
      - step: *package

      - parallel:
          steps:
            - step: *iac-scan
            - step: *sca
            - step: *pipeline-scan-pr

# =============================================================================
# TRIGGERS
#
# Inicia el custom pipeline veracode-pr cuando se envian commits a un pull
# request cuya rama destino es main.
# =============================================================================

triggers:
  pullrequest-push:
    - condition: BITBUCKET_PR_DESTINATION_BRANCH == "main"
      pipelines:
        - veracode-pr
