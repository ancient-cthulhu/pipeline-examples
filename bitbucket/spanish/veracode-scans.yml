# =============================================================================
# CI - Veracode (Bitbucket Pipelines)
#
# Renombra este archivo a bitbucket-pipelines.yml en la raiz de tu repositorio.
#
# Variables del repositorio (Repository settings > Pipelines > Repository variables):
#   VERACODE_API_ID     Veracode API ID          (Secured)
#   VERACODE_API_KEY    Veracode API Key         (Secured)
# Opcionales:
#   SRCCLR_API_TOKEN    Token de SCA basado en agente (Secured)
#   VERACODE_APP_NAME   Nombre del perfil de aplicacion (por defecto: {workspace}/{repo})
#
# Seleccion de escaneo (condiciones de inicio nativas, "triggers:" al final):
#   push a la rama por defecto   -> veracode-policy   (Policy Scan)
#   push a feature/**            -> veracode-feature  (Pipeline Scan, falla con cualquier hallazgo)
#   PR a la rama por defecto     -> veracode-pr       (Pipeline Scan, gate de politica)
#   todos los anteriores         -> SCA basado en agente (no bloqueante)
#
# Bitbucket no expone la rama por defecto como variable. Si la tuya no es
# "main", actualiza las dos condiciones en "triggers:".
# =============================================================================

image: maven:3.9-eclipse-temurin-17

definitions:
  steps:
    # -------------------------------------------------------------------------
    # PACKAGE: Autopackager de Veracode CLI
    # -------------------------------------------------------------------------
    - step: &package
        name: Empaquetar Artefactos
        script:
          - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
          - curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          - ./veracode version
          - mkdir -p verascan
          - ./veracode package --source . --output verascan --trust
          - ls -lhR verascan
          - find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
          - |
            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: No se encontraron artefactos empaquetados"
              exit 1
            fi
            echo "Artefactos encontrados ($(wc -l < artifact_list.txt)):"
            cat artifact_list.txt
        artifacts:
          - verascan/**
          - artifact_list.txt

    # -------------------------------------------------------------------------
    # SCA: SCA basado en agente (no bloqueante)
    # -------------------------------------------------------------------------
    - step: &sca
        name: SCA Basado en Agente
        script:
          # Mismo calculo que el perfil del policy scan
          - APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"
          - curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- scan --recursive --update-advisor --appname "$APP_NAME" || echo "Escaneo SCA completado"

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (feature): sin criterio de fallo, cada hallazgo cuenta
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-feature
        name: Pipeline Scan (feature)
        script:
          - GATE_POLICY=""
          - echo "Gate - falla con cualquier hallazgo"
          - &pipeline_scan_loop |
            apt-get update -qq && apt-get install -y -qq unzip >/dev/null
            curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
            unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

            mkdir -p scan_results
            FAILED=0
            FAILED_ARTIFACTS=""

            while IFS= read -r artifact; do
              NAME=$(basename "$artifact")
              echo "=========================================="
              echo "Escaneando: $NAME"
              echo "=========================================="

              set +e
              if [ -n "$GATE_POLICY" ]; then
                java -jar pipeline-scan.jar -f "$artifact" \
                  -vid "$VERACODE_API_ID" -vkey "$VERACODE_API_KEY" \
                  --issue_details true --policy_name "$GATE_POLICY"
              else
                java -jar pipeline-scan.jar -f "$artifact" \
                  -vid "$VERACODE_API_ID" -vkey "$VERACODE_API_KEY" \
                  --issue_details true
              fi
              RC=$?
              set -e

              # 0 = aprobado, 1-200 = cantidad de hallazgos, 253-255 = error o timeout
              if [ "$RC" -ge 253 ]; then
                echo "ERROR: Error de escaneo en $NAME (salida $RC)"
                FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              elif [ "$RC" -ne 0 ]; then
                echo "ERROR: $RC hallazgo(s) fallaron el gate en $NAME"
                FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              fi

              if [ -f results.json ]; then
                mv results.json "scan_results/${NAME}_results.json"
              fi
            done < artifact_list.txt

            if [ "$FAILED" -eq 1 ]; then
              echo "ERROR: Pipeline Scan fallo para:$FAILED_ARTIFACTS"
              exit 1
            fi
        artifacts:
          - scan_results/**

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (PR): evalua los hallazgos contra una politica de Veracode
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-pr
        name: Pipeline Scan (gate PR)
        script:
          - GATE_POLICY="Veracode Recommended Very High"
          - echo "Gate - politica $GATE_POLICY"
          - *pipeline_scan_loop
        artifacts:
          - scan_results/**

    # -------------------------------------------------------------------------
    # POLICY SCAN: push a la rama por defecto
    # -------------------------------------------------------------------------
    - step: &policy-scan
        name: Policy Scan
        script:
          - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
          - BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
          - curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
          - VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
          - |
            if [ -z "$VERSION" ]; then
              echo "ERROR: No se pudo resolver la version del API Wrapper"
              exit 1
            fi
            echo "Version del API Wrapper: $VERSION"
          - curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
          - unzip -o dist.zip -d .veracode
          - JAR=$(find .veracode -type f -name 'VeracodeJavaAPI*.jar' | head -n1)
          - |
            if [ -z "$JAR" ]; then
              echo "ERROR: No se encontro VeracodeJavaAPI.jar"
              exit 1
            fi
            cp "$JAR" VeracodeJavaAPI.jar
          - APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"
          - echo "Perfil de Aplicacion Veracode - $APP_NAME"
          - |
            java -jar VeracodeJavaAPI.jar \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              -action UploadAndScan \
              -appname "$APP_NAME" \
              -createprofile true \
              -autoscan true \
              -filepath verascan \
              -version "${BITBUCKET_BRANCH}-${BITBUCKET_BUILD_NUMBER}-$(date +%Y%m%d%H%M%S)"

# =============================================================================
# PIPELINES (custom, iniciados por los triggers de abajo)
# =============================================================================
pipelines:
  custom:
    veracode-policy:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *policy-scan

    veracode-feature:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *pipeline-scan-feature

    veracode-pr:
      - step: *package
      - parallel:
          steps:
            - step: *sca
            - step: *pipeline-scan-pr

# =============================================================================
# TRIGGERS (condiciones de inicio)
# =============================================================================
triggers:
  repository-push:
    - condition: BITBUCKET_BRANCH == "main"
      pipelines:
        - veracode-policy
    - condition: glob(BITBUCKET_BRANCH, "feature/**")
      pipelines:
        - veracode-feature
  pullrequest-push:
    - condition: BITBUCKET_PR_DESTINATION_BRANCH == "main"
      pipelines:
        - veracode-pr
