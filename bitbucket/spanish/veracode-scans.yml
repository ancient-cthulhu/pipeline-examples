# =============================================================================
# CI - Veracode (Bitbucket Pipelines)
#
# Rename this file to bitbucket-pipelines.yml in your repository root.
#
# Repository variables (Repository settings > Pipelines > Repository variables):
#   VERACODE_API_ID     Veracode API ID          (Secured)
#   VERACODE_API_KEY    Veracode API Key         (Secured)
#
# Optional:
#   SRCCLR_API_TOKEN    Agent-based SCA token    (Secured)
#   VERACODE_APP_NAME   Application profile name
#                       Default: {workspace}/{repo}
#   VERACODE_BUSINESS_CRITICALITY
#                       Used only when the profile is created
#                       Default: VeryHigh
#
# Scan selection:
#   Push to default branch:
#     - IaC and Secrets Scan
#     - Agent-based SCA
#     - Policy Scan
#
#   Push to any other branch:
#     - IaC and Secrets Scan
#     - Agent-based SCA
#     - Pipeline Scan, fail on any flaw, non-blocking
#
#   PR targeting default branch:
#     - IaC and Secrets Scan
#     - Agent-based SCA
#     - Pipeline Scan policy gate
#
# Bitbucket does not expose the repository default branch as a variable.
# If your default branch is not "main", update:
#   1. The "main:" branch selector
#   2. BITBUCKET_PR_DESTINATION_BRANCH in the trigger condition
# =============================================================================

image: maven:3.9-eclipse-temurin-17

definitions:
  steps:
    # -------------------------------------------------------------------------
    # PACKAGE: Veracode CLI autopackager
    # -------------------------------------------------------------------------
    - step: &package
        name: Package Artefacts
        script:
          - apt-get update -qq
          - apt-get install -y -qq curl unzip >/dev/null

          - mkdir -p /opt/veracode-cli
          - |
            cd /opt/veracode-cli
            curl -fsS "https://tools.veracode.com/veracode-cli/install" | sh

          - export PATH="/opt/veracode-cli:$PATH"
          - veracode version

          - rm -rf verascan
          - mkdir -p verascan

          - |
            veracode package \
              --source . \
              --type directory \
              --output verascan \
              --trust \
              --verbose

          - |
            echo "Generated by the Veracode Autopackager:"
            find verascan -type f -print | sort

          - |
            find verascan \
              -type f \
              -size +0c \
              | sort > artifact_list.txt

          - |
            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: Veracode Autopackager no genero artefactos"
              exit 1
            fi

            echo "Artifacts ($(wc -l < artifact_list.txt)):"
            cat artifact_list.txt

        artifacts:
          - verascan/**
          - artifact_list.txt

    # -------------------------------------------------------------------------
    # IaC AND SECRETS SCAN
    #
    # A Veracode CLI directory scan checks the repository for:
    #   - Infrastructure as Code misconfigurations
    #   - Exposed secrets
    # -------------------------------------------------------------------------
    - step: &iac-scan
        name: IaC and Secrets Scan
        on-fail:
          strategy: ignore
        script:
          - apt-get update -qq
          - apt-get install -y -qq curl >/dev/null

          - mkdir -p /opt/veracode-cli
          - |
            cd /opt/veracode-cli
            curl -fsS "https://tools.veracode.com/veracode-cli/install" | sh

          - export PATH="/opt/veracode-cli:$PATH"
          - veracode version

          - |
            if [ -z "${VERACODE_API_ID:-}" ]; then
              echo "ERROR: VERACODE_API_ID is not configured"
              exit 1
            fi

            if [ -z "${VERACODE_API_KEY:-}" ]; then
              echo "ERROR: VERACODE_API_KEY is not configured"
              exit 1
            fi

          - |
            export VERACODE_API_KEY_ID="$VERACODE_API_ID"
            export VERACODE_API_KEY_SECRET="$VERACODE_API_KEY"

            echo "Starting Veracode IaC and Secrets Scan"
            echo "Source: repository working directory"

            veracode scan \
              --source . \
              --type directory \
              --format table

    # -------------------------------------------------------------------------
    # SCA: Agent-based SCA
    #
    # This step is non-blocking. A failed SCA scan is reported by Bitbucket,
    # but it does not stop the remaining pipeline.
    # -------------------------------------------------------------------------
    - step: &sca
        name: Agent-Based SCA
        on-fail:
          strategy: ignore
        script:
          - |
            if [ -z "${SRCCLR_API_TOKEN:-}" ]; then
              echo "ERROR: SRCCLR_API_TOKEN is not configured"
              exit 1
            fi

          - |
            curl -sSL "https://sca-downloads.veracode.com/ci.sh" |
              bash -s -- scan --recursive --update-advisor

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (BRANCH)
    #
    # No policy is specified, so every reported flaw fails the scan command.
    #
    # The step is non-blocking:
    #   - Bitbucket shows Failed (Ignored)
    #   - The overall branch pipeline can remain green
    #   - The PR Pipeline Scan remains the actual merge gate
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-branch
        name: Pipeline Scan (branch)
        on-fail:
          strategy: ignore
        script:
          - |
            GATE_POLICY=""
            echo "Gate: fail on any flaw"

          - &pipeline_scan_loop |
            apt-get update -qq
            apt-get install -y -qq unzip curl >/dev/null

            curl -fsSO \
              "https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip"

            unzip -o \
              pipeline-scan-LATEST.zip \
              pipeline-scan.jar

            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: artifact_list.txt is missing or empty"
              exit 1
            fi

            mkdir -p scan_results

            FAILED=0
            FAILED_ARTIFACTS=""

            while IFS= read -r artifact; do
              NAME=$(basename "$artifact")
              SAFE_NAME=$(printf '%s' "$NAME" | tr '/ ' '__')

              echo "=========================================="
              echo "Scanning: $NAME"
              echo "Artifact: $artifact"
              echo "=========================================="

              if [ ! -f "$artifact" ]; then
                echo "ERROR: Artifact does not exist: $artifact"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                continue
              fi

              rm -f results.json

              set +e

              if [ -n "$GATE_POLICY" ]; then
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  --policy_name "$GATE_POLICY" \
                  < /dev/null
              else
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  < /dev/null
              fi

              RC=$?

              set -e

              # Pipeline Scan exit codes:
              #   0       = scan passed
              #   1-200   = number of findings that failed the gate
              #   253-255 = scan error, invalid request, or timeout
              if [ "$RC" -ge 253 ]; then
                echo "ERROR: Scan error for $NAME; exit code: $RC"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              elif [ "$RC" -ne 0 ]; then
                echo "ERROR: $RC finding(s) failed the gate for $NAME"
                FAILED=1
                FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
              else
                echo "Pipeline Scan passed for $NAME"
              fi

              if [ -f results.json ]; then
                mv \
                  results.json \
                  "scan_results/${SAFE_NAME}_results.json"
              fi
            done < artifact_list.txt

            if [ "$FAILED" -eq 1 ]; then
              echo "ERROR: Pipeline Scan failed for:$FAILED_ARTIFACTS"
              exit 1
            fi

            echo "All Pipeline Scans completed successfully"

        artifacts:
          upload:
            - name: pipeline-scan-results-branch
              type: scoped
              capture-on: always
              paths:
                - scan_results/**

    # -------------------------------------------------------------------------
    # PIPELINE SCAN (PR)
    #
    # Evaluate Pipeline Scan findings against the specified Veracode policy.
    # This step is blocking and acts as the PR merge gate.
    # -------------------------------------------------------------------------
    - step: &pipeline-scan-pr
        name: Pipeline Scan (PR gate)
        script:
          - |
            GATE_POLICY="Veracode Recommended Very High"
            echo "Gate: policy '$GATE_POLICY'"

          - *pipeline_scan_loop

        artifacts:
          upload:
            - name: pipeline-scan-results-pr
              type: scoped
              capture-on: always
              paths:
                - scan_results/**

    # -------------------------------------------------------------------------
    # POLICY SCAN
    #
    # Runs after a push to the default branch.
    #
    # The scan:
    #   - Resolves the latest Veracode Java API Wrapper
    #   - Creates the application profile if it does not exist
    #   - Uploads all packaged artifacts from the verascan directory
    #   - Starts a Policy Scan
    # -------------------------------------------------------------------------
    - step: &policy-scan
        name: Policy Scan
        script:
          - apt-get update -qq
          - apt-get install -y -qq unzip curl >/dev/null

          - |
            BASE="https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java"

            curl -fsS \
              "$BASE/maven-metadata.xml" \
              -o maven-metadata.xml

          - |
            VERSION=$(
              grep -oPm1 "(?<=<latest>)[^<]+" \
                maven-metadata.xml
            )

            if [ -z "$VERSION" ]; then
              echo "ERROR: Failed to resolve API Wrapper version"
              exit 1
            fi

            echo "API Wrapper version: $VERSION"

          - |
            curl -fsSL \
              "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" \
              -o dist.zip

          - unzip -o dist.zip -d .veracode

          - |
            JAR=$(
              find .veracode \
                -type f \
                -name 'VeracodeJavaAPI*.jar' \
                | head -n1
            )

            if [ -z "$JAR" ]; then
              echo "ERROR: VeracodeJavaAPI.jar not found"
              exit 1
            fi

            cp "$JAR" VeracodeJavaAPI.jar

          - |
            if [ ! -d verascan ]; then
              echo "ERROR: verascan directory was not restored"
              exit 1
            fi

            if [ ! -s artifact_list.txt ]; then
              echo "ERROR: artifact_list.txt was not restored"
              exit 1
            fi

          - |
            APP_NAME="${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}"

            echo "Veracode Application Profile: $APP_NAME"
            echo "Business Criticality: ${VERACODE_BUSINESS_CRITICALITY:-VeryHigh}"

          - |
            SCAN_VERSION="${BITBUCKET_BRANCH}-${BITBUCKET_BUILD_NUMBER}-$(date +%Y%m%d%H%M%S)"

            echo "Policy Scan version: $SCAN_VERSION"

            java -jar VeracodeJavaAPI.jar \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              -action UploadAndScan \
              -appname "$APP_NAME" \
              -createprofile true \
              -criticality "${VERACODE_BUSINESS_CRITICALITY:-VeryHigh}" \
              -filepath verascan \
              -version "$SCAN_VERSION"

# =============================================================================
# PIPELINES
# =============================================================================

pipelines:
  # ---------------------------------------------------------------------------
  # Default branch push
  #
  # Package first, then run in parallel:
  #   - IaC and Secrets Scan
  #   - Agent-based SCA
  #   - Policy Scan
  # ---------------------------------------------------------------------------
  branches:
    main:
      - step: *package

      - parallel:
          steps:
            - step: *iac-scan
            - step: *sca
            - step: *policy-scan

  # ---------------------------------------------------------------------------
  # Every other branch push
  #
  # "default" excludes tag pushes.
  #
  # Package first, then run in parallel:
  #   - IaC and Secrets Scan
  #   - Agent-based SCA
  #   - Pipeline Scan
  # ---------------------------------------------------------------------------
  default:
    - step: *package

    - parallel:
        steps:
          - step: *iac-scan
          - step: *sca
          - step: *pipeline-scan-branch

  # ---------------------------------------------------------------------------
  # Pull request pipeline
  #
  # Started by the pullrequest-push trigger below when the PR destination
  # branch is "main".
  # ---------------------------------------------------------------------------
  custom:
    veracode-pr:
      - step: *package

      - parallel:
          steps:
            - step: *iac-scan
            - step: *sca
            - step: *pipeline-scan-pr

# =============================================================================
# TRIGGERS
#
# Start the custom PR pipeline when commits are pushed to a pull request whose
# destination branch is "main".
# =============================================================================

triggers:
  pullrequest-push:
    - condition: BITBUCKET_PR_DESTINATION_BRANCH == "main"
      pipelines:
        - veracode-pr
