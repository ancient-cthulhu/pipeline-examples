name: CI - Veracode

# Veracode Security Scanning for GitHub Actions
#
# Required secrets:
#   VERACODE_API_ID     Veracode API ID
#   VERACODE_API_KEY    Veracode API Key
# Optional secrets:
#   SRCCLR_API_TOKEN    Agent-based SCA token
#   VERACODE_APP_NAME   Application profile name (default: {org}/{repo})
#
# Scan selection:
#   push to default branch          -> Policy Scan (all artifacts, one upload)
#   push to feature/**              -> Pipeline Scan (fails on any flaw)
#   pull_request to default branch  -> Pipeline Scan (policy gate)
#   all of the above                -> Agent-based SCA (non-blocking)
#
# If your default branch is not "main", update the branch filters under "on:".
# Job conditions resolve the default branch dynamically.

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight policy upload on the default branch
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
  VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
  PR_GATE_POLICY: Veracode Recommended Very High

jobs:
  # ===========================================================================
  # PACKAGE: Veracode CLI autopackager
  # ===========================================================================
  package:
    name: Package Artifacts
    runs-on: ubuntu-latest
    # Fork PRs do not receive secrets, skip them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    outputs:
      app_name: ${{ steps.app-name.outputs.app_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Veracode App Name
        id: app-name
        env:
          CUSTOM_APP_NAME: ${{ secrets.VERACODE_APP_NAME }}
          REPO_NAME: ${{ github.repository }}
        run: |
          APP_NAME="${CUSTOM_APP_NAME:-$REPO_NAME}"
          echo "Veracode Application Profile: $APP_NAME"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          ./veracode version

      - name: Run Veracode Autopackager
        run: |
          mkdir -p verascan
          ./veracode package --source . --output verascan --trust
          ls -lhR verascan

      - name: Validate Artifacts
        run: |
          find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
          if [ ! -s artifact_list.txt ]; then
            echo "::error::No packaged artifacts found"
            exit 1
          fi
          echo "Artifacts found ($(wc -l < artifact_list.txt)):"
          cat artifact_list.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verascan
          path: |
            verascan/
            artifact_list.txt

  # ===========================================================================
  # SCA: Agent-based SCA (non-blocking)
  # ===========================================================================
  sca:
    name: Agent-Based SCA
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Veracode SCA
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        run: |
          curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- scan --recursive --update-advisor || echo "SCA scan completed"

  # ===========================================================================
  # PIPELINE SCAN: feature/** push (any flaw fails) and PR (policy gate)
  # ===========================================================================
  pipeline-scan:
    name: Pipeline Scan
    needs: package
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: verascan

      - name: Download Pipeline Scanner
        run: |
          curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

      - name: Run Pipeline Scan (all artifacts)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR:      evaluate findings against a Veracode policy
          # feature: no fail criteria, every flaw counts toward the exit code
          GATE_ARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            GATE_ARGS=(--policy_name "$PR_GATE_POLICY")
            echo "Gate: policy '$PR_GATE_POLICY'"
          else
            echo "Gate: fail on any flaw"
          fi

          mkdir -p scan_results
          FAILED=0
          FAILED_ARTIFACTS=""

          while IFS= read -r artifact; do
            NAME=$(basename "$artifact")
            echo "=========================================="
            echo "Scanning: $NAME"
            echo "=========================================="

            set +e
            java -jar pipeline-scan.jar \
              -f "$artifact" \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              --issue_details true \
              "${GATE_ARGS[@]}"
            RC=$?
            set -e

            # 0 = pass, 1-200 = flaw count, 253-255 = error or timeout
            if [ "$RC" -ge 253 ]; then
              echo "::error::Scan error for $NAME (exit $RC)"
              FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
            elif [ "$RC" -ne 0 ]; then
              echo "::error::$RC flaw(s) failed the gate for $NAME"
              FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
            fi

            if [ -f results.json ]; then
              mv results.json "scan_results/${NAME}_results.json"
            fi
          done < artifact_list.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Pipeline Scan failed for:$FAILED_ARTIFACTS"
          fi
          exit "$FAILED"

      - name: Upload Scan Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-scan-results
          path: scan_results/
          if-no-files-found: ignore

  # ===========================================================================
  # POLICY SCAN: push to default branch
  # ===========================================================================
  policy-scan:
    name: Policy Scan (default branch)
    needs: package
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: verascan

      - name: Download Veracode Java API Wrapper
        run: |
          BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
          curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
          VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve API Wrapper version"
            exit 1
          fi
          echo "API Wrapper version: $VERSION"
          curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
          unzip -o dist.zip -d .veracode
          JAR=$(find .veracode -type f -name "VeracodeJavaAPI*.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "::error::VeracodeJavaAPI.jar not found"
            exit 1
          fi
          cp "$JAR" VeracodeJavaAPI.jar

      - name: Upload and Scan (Policy)
        env:
          APP_NAME: ${{ needs.package.outputs.app_name }}
          SCAN_VERSION: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          java -jar VeracodeJavaAPI.jar \
            -vid "$VERACODE_API_ID" \
            -vkey "$VERACODE_API_KEY" \
            -action UploadAndScan \
            -appname "$APP_NAME" \
            -createprofile true \
            -autoscan true \
            -filepath verascan \
            -version "$SCAN_VERSION"
