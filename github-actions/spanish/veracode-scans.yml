name: CI - Veracode

# Escaneo de seguridad Veracode para GitHub Actions
#
# Secretos requeridos:
#   VERACODE_API_ID     Veracode API ID
#   VERACODE_API_KEY    Veracode API Key
# Secretos opcionales:
#   SRCCLR_API_TOKEN    Token de SCA basado en agente
#   VERACODE_APP_NAME   Nombre del perfil de aplicacion (por defecto: {org}/{repo})
#
# Seleccion de escaneo:
#   push a la rama por defecto      -> Policy Scan (todos los artefactos, una carga)
#   push a feature/**               -> Pipeline Scan (falla con cualquier hallazgo)
#   pull_request a rama por defecto -> Pipeline Scan (gate de politica)
#   todos los anteriores            -> SCA basado en agente (no bloqueante)
#
# Si tu rama por defecto no es "main", actualiza los filtros de ramas en "on:".
# Las condiciones de los jobs resuelven la rama por defecto dinamicamente.

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca cancelar una carga de politica en curso en la rama por defecto
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
  VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
  PR_GATE_POLICY: Veracode Recommended Very High

jobs:
  # ===========================================================================
  # PACKAGE: Autopackager de Veracode CLI
  # ===========================================================================
  package:
    name: Empaquetar Artefactos
    runs-on: ubuntu-latest
    # Los PRs desde forks no reciben secretos, se omiten
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    outputs:
      app_name: ${{ steps.app-name.outputs.app_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Definir Nombre de App Veracode
        id: app-name
        env:
          CUSTOM_APP_NAME: ${{ secrets.VERACODE_APP_NAME }}
          REPO_NAME: ${{ github.repository }}
        run: |
          APP_NAME="${CUSTOM_APP_NAME:-$REPO_NAME}"
          echo "Perfil de Aplicacion Veracode: $APP_NAME"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Instalar Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          ./veracode version

      - name: Ejecutar Autopackager de Veracode
        run: |
          mkdir -p verascan
          ./veracode package --source . --output verascan --trust
          ls -lhR verascan

      - name: Validar Artefactos
        run: |
          find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
          if [ ! -s artifact_list.txt ]; then
            echo "::error::No se encontraron artefactos empaquetados"
            exit 1
          fi
          echo "Artefactos encontrados ($(wc -l < artifact_list.txt)):"
          cat artifact_list.txt

      - name: Subir Artefactos
        uses: actions/upload-artifact@v7
        with:
          name: verascan
          path: |
            verascan/
            artifact_list.txt

  # ===========================================================================
  # SCA: SCA basado en agente (no bloqueante)
  # ===========================================================================
  sca:
    name: SCA Basado en Agente
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ejecutar Veracode SCA
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
          # --appname se autentica con la Plataforma via HMAC, que el agente
          # lee exactamente desde estos dos nombres de variable
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
          CUSTOM_APP_NAME: ${{ secrets.VERACODE_APP_NAME }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Mismo calculo que el perfil del policy scan
          APP_NAME="${CUSTOM_APP_NAME:-$REPO_NAME}"
          echo "Perfil de Aplicacion Veracode: $APP_NAME"
          curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- \
            scan --recursive --update-advisor --appname="$APP_NAME" || echo "Escaneo SCA completado"

  # ===========================================================================
  # PIPELINE SCAN: push a feature/** (falla con cualquier hallazgo) y PR (gate de politica)
  # ===========================================================================
  pipeline-scan:
    name: Pipeline Scan
    needs: package
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Artefactos
        uses: actions/download-artifact@v8
        with:
          name: verascan

      - name: Descargar Pipeline Scanner
        run: |
          curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

      - name: Ejecutar Pipeline Scan (todos los artefactos)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR:      evalua los hallazgos contra una politica de Veracode
          # feature: sin criterio de fallo, cada hallazgo cuenta en el codigo de salida
          GATE_ARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            GATE_ARGS=(--policy_name "$PR_GATE_POLICY")
            echo "Gate: politica '$PR_GATE_POLICY'"
          else
            echo "Gate: falla con cualquier hallazgo"
          fi

          mkdir -p scan_results
          FAILED=0
          FAILED_ARTIFACTS=""

          while IFS= read -r artifact; do
            NAME=$(basename "$artifact")
            echo "=========================================="
            echo "Escaneando: $NAME"
            echo "=========================================="

            set +e
            java -jar pipeline-scan.jar \
              -f "$artifact" \
              -vid "$VERACODE_API_ID" \
              -vkey "$VERACODE_API_KEY" \
              --issue_details true \
              "${GATE_ARGS[@]}"
            RC=$?
            set -e

            # 0 = aprobado, 1-200 = cantidad de hallazgos, 253-255 = error o timeout
            if [ "$RC" -ge 253 ]; then
              echo "::error::Error de escaneo en $NAME (salida $RC)"
              FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
            elif [ "$RC" -ne 0 ]; then
              echo "::error::$RC hallazgo(s) fallaron el gate en $NAME"
              FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
            fi

            if [ -f results.json ]; then
              mv results.json "scan_results/${NAME}_results.json"
            fi
          done < artifact_list.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Pipeline Scan fallo para:$FAILED_ARTIFACTS"
          fi
          exit "$FAILED"

      - name: Subir Resultados del Escaneo
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-scan-results
          path: scan_results/
          if-no-files-found: ignore

  # ===========================================================================
  # POLICY SCAN: push a la rama por defecto
  # ===========================================================================
  policy-scan:
    name: Policy Scan (rama por defecto)
    needs: package
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Artefactos
        uses: actions/download-artifact@v8
        with:
          name: verascan

      - name: Descargar Veracode Java API Wrapper
        run: |
          BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
          curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
          VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo resolver la version del API Wrapper"
            exit 1
          fi
          echo "Version del API Wrapper: $VERSION"
          curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
          unzip -o dist.zip -d .veracode
          JAR=$(find .veracode -type f -name "VeracodeJavaAPI*.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "::error::No se encontro VeracodeJavaAPI.jar"
            exit 1
          fi
          cp "$JAR" VeracodeJavaAPI.jar

      - name: Subir y Escanear (Politica)
        env:
          APP_NAME: ${{ needs.package.outputs.app_name }}
          SCAN_VERSION: ${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          java -jar VeracodeJavaAPI.jar \
            -vid "$VERACODE_API_ID" \
            -vkey "$VERACODE_API_KEY" \
            -action UploadAndScan \
            -appname "$APP_NAME" \
            -createprofile true \
            -autoscan true \
            -filepath verascan \
            -version "$SCAN_VERSION"
