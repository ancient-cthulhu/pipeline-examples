# =============================================================================
# CI - Veracode (Azure Pipelines)
#
# Variable group "veracode-credentials" (Pipelines > Library):
#   VERACODE_API_ID     Veracode API ID           (secret)
#   VERACODE_API_KEY    Veracode API Key          (secret)
# Optional:
#   SRCCLR_API_TOKEN    Agent-based SCA token     (secret)
#   VERACODE_APP_NAME   Application profile name  (NOT secret, default: {org}/{project}/{repo})
#
# Scan selection:
#   push to default branch          -> Policy Scan (all artifacts, one upload)
#   push to feature/*               -> Pipeline Scan (fails on any flaw)
#   pull request to default branch  -> Pipeline Scan (policy gate)
#   all of the above                -> Agent-based SCA (non-blocking)
#
# Pull request triggers:
#   Azure Repos Git: "pr:" is ignored. Add this pipeline as a Build Validation
#                    branch policy on the default branch.
#   GitHub / Bitbucket Cloud: the "pr:" block below applies.
#
# If your default branch is not "main", update DEFAULT_BRANCH and both
# branch filters below.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

variables:
  - group: veracode-credentials
  - name: DEFAULT_BRANCH
    value: main
  - name: PR_GATE_POLICY
    value: Veracode Recommended Very High

pool:
  vmImage: ubuntu-latest

stages:
  # ===========================================================================
  # PACKAGE: Veracode CLI autopackager
  # ===========================================================================
  - stage: Package
    displayName: Package
    condition: ne(variables['System.PullRequest.IsFork'], 'True')
    jobs:
      - job: Autopackage
        displayName: Veracode CLI autopackager
        steps:
          - checkout: self

          - script: |
              set -eo pipefail
              cd "$(Agent.TempDirectory)"
              curl -fsS https://tools.veracode.com/veracode-cli/install | sh
              ./veracode version

              OUT="$(Build.ArtifactStagingDirectory)/veracode"
              mkdir -p "$OUT/verascan"
              ./veracode package --source "$(Build.SourcesDirectory)" --output "$OUT/verascan" --trust
              ls -lhR "$OUT/verascan"

              cd "$OUT"
              find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
              if [ ! -s artifact_list.txt ]; then
                echo "##vso[task.logissue type=error]No packaged artifacts found"
                exit 1
              fi
              echo "Artifacts found ($(wc -l < artifact_list.txt)):"
              cat artifact_list.txt
            displayName: Install CLI and package

          - task: PublishPipelineArtifact@1
            displayName: Publish packaged artifacts
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/veracode
              artifactName: veracode

  # ===========================================================================
  # SCA: Agent-based SCA (non-blocking, runs in parallel with Package)
  # ===========================================================================
  - stage: SCA
    displayName: Agent-Based SCA
    dependsOn: []
    condition: ne(variables['System.PullRequest.IsFork'], 'True')
    jobs:
      - job: SCAScan
        displayName: Veracode Agent-Based SCA
        steps:
          - checkout: self
          - script: |
              # Same computation as the policy scan profile
              ORG_NAME=$(echo "$SYSTEM_COLLECTIONURI" | sed -E 's|https://dev.azure.com/([^/]+)/?|\1|; s|https://([^.]+)\.visualstudio.com/?|\1|')
              APP_NAME="${VERACODE_APP_NAME:-${ORG_NAME}/${SYSTEM_TEAMPROJECT}/${BUILD_REPOSITORY_NAME}}"
              echo "Veracode Application Profile: $APP_NAME"
              curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- \
                scan --recursive --update-advisor --appname "$APP_NAME" || echo "SCA scan completed"
            displayName: Veracode SCA scan
            env:
              SRCCLR_API_TOKEN: $(SRCCLR_API_TOKEN)

  # ===========================================================================
  # PIPELINE SCAN: feature/* push (any flaw fails) and PR (policy gate)
  # ===========================================================================
  - stage: PipelineScan
    displayName: Pipeline Scan
    dependsOn: Package
    condition: |
      and(
        succeeded(),
        or(
          and(
            ne(variables['Build.Reason'], 'PullRequest'),
            startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
          ),
          and(
            eq(variables['Build.Reason'], 'PullRequest'),
            in(variables['System.PullRequest.TargetBranch'], variables['DEFAULT_BRANCH'], format('refs/heads/{0}', variables['DEFAULT_BRANCH']))
          )
        )
      )
    jobs:
      - job: PipelineScanJob
        displayName: Veracode Pipeline Scan (all artifacts)
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download packaged artifacts
            inputs:
              artifactName: veracode
              targetPath: $(Pipeline.Workspace)/veracode

          - script: |
              set -eo pipefail
              for v in VERACODE_API_ID VERACODE_API_KEY; do
                case "${!v}" in ''|'$('*) echo "##vso[task.logissue type=error]$v is not set"; exit 1;; esac
              done

              curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
              unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

              # PR:      evaluate findings against a Veracode policy
              # feature: no fail criteria, every flaw counts toward the exit code
              GATE_ARGS=()
              if [ "$BUILD_REASON" = "PullRequest" ]; then
                GATE_ARGS=(--policy_name "$PR_GATE_POLICY")
                echo "Gate: policy '$PR_GATE_POLICY'"
              else
                echo "Gate: fail on any flaw"
              fi

              mkdir -p scan_results
              FAILED=0
              FAILED_ARTIFACTS=""

              while IFS= read -r artifact; do
                NAME=$(basename "$artifact")
                echo "=========================================="
                echo "Scanning: $NAME"
                echo "=========================================="

                set +e
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  "${GATE_ARGS[@]}"
                RC=$?
                set -e

                # 0 = pass, 1-200 = flaw count, 253-255 = error or timeout
                if [ "$RC" -ge 253 ]; then
                  echo "##vso[task.logissue type=error]Scan error for $NAME (exit $RC)"
                  FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                elif [ "$RC" -ne 0 ]; then
                  echo "##vso[task.logissue type=error]$RC flaw(s) failed the gate for $NAME"
                  FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                fi

                if [ -f results.json ]; then
                  mv results.json "scan_results/${NAME}_results.json"
                fi
              done < artifact_list.txt

              if [ "$FAILED" -eq 1 ]; then
                echo "##vso[task.logissue type=error]Pipeline Scan failed for:$FAILED_ARTIFACTS"
              fi
              exit "$FAILED"
            displayName: Run Pipeline Scan
            workingDirectory: $(Pipeline.Workspace)/veracode
            env:
              VERACODE_API_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY: $(VERACODE_API_KEY)

          - task: PublishPipelineArtifact@1
            displayName: Publish Pipeline Scan results
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
              targetPath: $(Pipeline.Workspace)/veracode/scan_results
              artifactName: veracode-pipeline-scan-results-$(System.JobAttempt)

  # ===========================================================================
  # POLICY SCAN: push to default branch
  # ===========================================================================
  - stage: PolicyScan
    displayName: Policy Scan
    dependsOn: Package
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], format('refs/heads/{0}', variables['DEFAULT_BRANCH']))
      )
    jobs:
      - job: PolicyScanJob
        displayName: Veracode Policy Scan
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Download packaged artifacts
            inputs:
              artifactName: veracode
              targetPath: $(Pipeline.Workspace)/veracode

          - script: |
              set -eo pipefail
              for v in VERACODE_API_ID VERACODE_API_KEY; do
                case "${!v}" in ''|'$('*) echo "##vso[task.logissue type=error]$v is not set"; exit 1;; esac
              done

              BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
              curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
              VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
              if [ -z "$VERSION" ]; then
                echo "##vso[task.logissue type=error]Failed to resolve API Wrapper version"
                exit 1
              fi
              echo "API Wrapper version: $VERSION"
              curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
              unzip -o dist.zip -d .veracode
              JAR=$(find .veracode -type f -name "VeracodeJavaAPI*.jar" | head -n1)
              if [ -z "$JAR" ]; then
                echo "##vso[task.logissue type=error]VeracodeJavaAPI.jar not found"
                exit 1
              fi

              ORG_NAME=$(echo "$SYSTEM_COLLECTIONURI" | sed -E 's|https://dev.azure.com/([^/]+)/?|\1|; s|https://([^.]+)\.visualstudio.com/?|\1|')
              APP_NAME="${VERACODE_APP_NAME:-${ORG_NAME}/${SYSTEM_TEAMPROJECT}/${BUILD_REPOSITORY_NAME}}"
              echo "Veracode Application Profile: $APP_NAME"

              java -jar "$JAR" \
                -vid "$VERACODE_API_ID" \
                -vkey "$VERACODE_API_KEY" \
                -action UploadAndScan \
                -appname "$APP_NAME" \
                -createprofile true \
                -autoscan true \
                -filepath verascan \
                -version "$(Build.BuildNumber)-$(System.JobAttempt)"
            displayName: Upload and Scan (Policy)
            workingDirectory: $(Pipeline.Workspace)/veracode
            env:
              VERACODE_API_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY: $(VERACODE_API_KEY)
