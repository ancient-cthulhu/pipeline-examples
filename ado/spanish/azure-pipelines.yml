# =============================================================================
# CI - Veracode (Azure Pipelines)
#
# Grupo de variables "veracode-credentials" (Pipelines > Library):
#   VERACODE_API_ID     Veracode API ID           (secret)
#   VERACODE_API_KEY    Veracode API Key          (secret)
# Opcionales:
#   SRCCLR_API_TOKEN    Token de SCA basado en agente (secret)
#   VERACODE_APP_NAME   Nombre del perfil de aplicacion (NO secret, por defecto: {org}/{project}/{repo})
#
# Seleccion de escaneo:
#   push a la rama por defecto      -> Policy Scan (todos los artefactos, una carga)
#   push a feature/*                -> Pipeline Scan (falla con cualquier hallazgo)
#   pull request a rama por defecto -> Pipeline Scan (gate de politica)
#   todos los anteriores            -> SCA basado en agente (no bloqueante)
#
# Disparadores de pull request:
#   Azure Repos Git: "pr:" se ignora. Agrega este pipeline como politica de rama
#                    Build Validation en la rama por defecto.
#   GitHub / Bitbucket Cloud: aplica el bloque "pr:" de abajo.
#
# Si tu rama por defecto no es "main", actualiza DEFAULT_BRANCH y ambos
# filtros de ramas de abajo.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

variables:
  - group: veracode-credentials
  - name: DEFAULT_BRANCH
    value: main
  - name: PR_GATE_POLICY
    value: Veracode Recommended Very High

pool:
  vmImage: ubuntu-latest

stages:
  # ===========================================================================
  # PACKAGE: Autopackager de Veracode CLI
  # ===========================================================================
  - stage: Package
    displayName: Package
    condition: ne(variables['System.PullRequest.IsFork'], 'True')
    jobs:
      - job: Autopackage
        displayName: Autopackager de Veracode CLI
        steps:
          - checkout: self

          - script: |
              set -eo pipefail
              cd "$(Agent.TempDirectory)"
              curl -fsS https://tools.veracode.com/veracode-cli/install | sh
              ./veracode version

              OUT="$(Build.ArtifactStagingDirectory)/veracode"
              mkdir -p "$OUT/verascan"
              ./veracode package --source "$(Build.SourcesDirectory)" --output "$OUT/verascan" --trust
              ls -lhR "$OUT/verascan"

              cd "$OUT"
              find verascan -type f \( -name "*.war" -o -name "*.jar" -o -name "*.zip" \) > artifact_list.txt
              if [ ! -s artifact_list.txt ]; then
                echo "##vso[task.logissue type=error]No se encontraron artefactos empaquetados"
                exit 1
              fi
              echo "Artefactos encontrados ($(wc -l < artifact_list.txt)):"
              cat artifact_list.txt
            displayName: Instalar CLI y empaquetar

          - task: PublishPipelineArtifact@1
            displayName: Publicar artefactos empaquetados
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/veracode
              artifactName: veracode

  # ===========================================================================
  # SCA: SCA basado en agente (no bloqueante, corre en paralelo con Package)
  # ===========================================================================
  - stage: SCA
    displayName: SCA Basado en Agente
    dependsOn: []
    condition: ne(variables['System.PullRequest.IsFork'], 'True')
    jobs:
      - job: SCAScan
        displayName: Veracode SCA Basado en Agente
        steps:
          - checkout: self
          - script: |
              # Mismo calculo que el perfil del policy scan
              ORG_NAME=$(echo "$SYSTEM_COLLECTIONURI" | sed -E 's|https://dev.azure.com/([^/]+)/?|\1|; s|https://([^.]+)\.visualstudio.com/?|\1|')
              APP_NAME="${VERACODE_APP_NAME:-${ORG_NAME}/${SYSTEM_TEAMPROJECT}/${BUILD_REPOSITORY_NAME}}"
              echo "Perfil de Aplicacion Veracode: $APP_NAME"
              curl -sSL https://sca-downloads.veracode.com/ci.sh | bash -s -- \
                scan --recursive --update-advisor --appname="$APP_NAME" || echo "Escaneo SCA completado"
            displayName: Escaneo Veracode SCA
            env:
              SRCCLR_API_TOKEN: $(SRCCLR_API_TOKEN)
              # --appname se autentica con la Plataforma via HMAC, que el agente
              # lee exactamente desde estos dos nombres de variable
              VERACODE_API_KEY_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY_SECRET: $(VERACODE_API_KEY)

  # ===========================================================================
  # PIPELINE SCAN: push a feature/* (falla con cualquier hallazgo) y PR (gate de politica)
  # ===========================================================================
  - stage: PipelineScan
    displayName: Pipeline Scan
    dependsOn: Package
    condition: |
      and(
        succeeded(),
        or(
          and(
            ne(variables['Build.Reason'], 'PullRequest'),
            startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')
          ),
          and(
            eq(variables['Build.Reason'], 'PullRequest'),
            in(variables['System.PullRequest.TargetBranch'], variables['DEFAULT_BRANCH'], format('refs/heads/{0}', variables['DEFAULT_BRANCH']))
          )
        )
      )
    jobs:
      - job: PipelineScanJob
        displayName: Veracode Pipeline Scan (todos los artefactos)
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Descargar artefactos empaquetados
            inputs:
              artifactName: veracode
              targetPath: $(Pipeline.Workspace)/veracode

          - script: |
              set -eo pipefail
              for v in VERACODE_API_ID VERACODE_API_KEY; do
                case "${!v}" in ''|'$('*) echo "##vso[task.logissue type=error]$v no esta definida"; exit 1;; esac
              done

              curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
              unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar

              # PR:      evalua los hallazgos contra una politica de Veracode
              # feature: sin criterio de fallo, cada hallazgo cuenta en el codigo de salida
              GATE_ARGS=()
              if [ "$BUILD_REASON" = "PullRequest" ]; then
                GATE_ARGS=(--policy_name "$PR_GATE_POLICY")
                echo "Gate: politica '$PR_GATE_POLICY'"
              else
                echo "Gate: falla con cualquier hallazgo"
              fi

              mkdir -p scan_results
              FAILED=0
              FAILED_ARTIFACTS=""

              while IFS= read -r artifact; do
                NAME=$(basename "$artifact")
                echo "=========================================="
                echo "Escaneando: $NAME"
                echo "=========================================="

                set +e
                java -jar pipeline-scan.jar \
                  -f "$artifact" \
                  -vid "$VERACODE_API_ID" \
                  -vkey "$VERACODE_API_KEY" \
                  --issue_details true \
                  "${GATE_ARGS[@]}"
                RC=$?
                set -e

                # 0 = aprobado, 1-200 = cantidad de hallazgos, 253-255 = error o timeout
                if [ "$RC" -ge 253 ]; then
                  echo "##vso[task.logissue type=error]Error de escaneo en $NAME (salida $RC)"
                  FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                elif [ "$RC" -ne 0 ]; then
                  echo "##vso[task.logissue type=error]$RC hallazgo(s) fallaron el gate en $NAME"
                  FAILED=1; FAILED_ARTIFACTS="$FAILED_ARTIFACTS $NAME"
                fi

                if [ -f results.json ]; then
                  mv results.json "scan_results/${NAME}_results.json"
                fi
              done < artifact_list.txt

              if [ "$FAILED" -eq 1 ]; then
                echo "##vso[task.logissue type=error]Pipeline Scan fallo para:$FAILED_ARTIFACTS"
              fi
              exit "$FAILED"
            displayName: Ejecutar Pipeline Scan
            workingDirectory: $(Pipeline.Workspace)/veracode
            env:
              VERACODE_API_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY: $(VERACODE_API_KEY)

          - task: PublishPipelineArtifact@1
            displayName: Publicar resultados de Pipeline Scan
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
              targetPath: $(Pipeline.Workspace)/veracode/scan_results
              artifactName: veracode-pipeline-scan-results-$(System.JobAttempt)

  # ===========================================================================
  # POLICY SCAN: push a la rama por defecto
  # ===========================================================================
  - stage: PolicyScan
    displayName: Policy Scan
    dependsOn: Package
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], format('refs/heads/{0}', variables['DEFAULT_BRANCH']))
      )
    jobs:
      - job: PolicyScanJob
        displayName: Veracode Policy Scan
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Descargar artefactos empaquetados
            inputs:
              artifactName: veracode
              targetPath: $(Pipeline.Workspace)/veracode

          - script: |
              set -eo pipefail
              for v in VERACODE_API_ID VERACODE_API_KEY; do
                case "${!v}" in ''|'$('*) echo "##vso[task.logissue type=error]$v no esta definida"; exit 1;; esac
              done

              BASE=https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java
              curl -fsS "$BASE/maven-metadata.xml" -o maven-metadata.xml
              VERSION=$(grep -oPm1 "(?<=<latest>)[^<]+" maven-metadata.xml)
              if [ -z "$VERSION" ]; then
                echo "##vso[task.logissue type=error]No se pudo resolver la version del API Wrapper"
                exit 1
              fi
              echo "Version del API Wrapper: $VERSION"
              curl -fsSL "$BASE/${VERSION}/vosp-api-wrappers-java-${VERSION}-dist.zip" -o dist.zip
              unzip -o dist.zip -d .veracode
              JAR=$(find .veracode -type f -name "VeracodeJavaAPI*.jar" | head -n1)
              if [ -z "$JAR" ]; then
                echo "##vso[task.logissue type=error]No se encontro VeracodeJavaAPI.jar"
                exit 1
              fi

              ORG_NAME=$(echo "$SYSTEM_COLLECTIONURI" | sed -E 's|https://dev.azure.com/([^/]+)/?|\1|; s|https://([^.]+)\.visualstudio.com/?|\1|')
              APP_NAME="${VERACODE_APP_NAME:-${ORG_NAME}/${SYSTEM_TEAMPROJECT}/${BUILD_REPOSITORY_NAME}}"
              echo "Perfil de Aplicacion Veracode: $APP_NAME"

              java -jar "$JAR" \
                -vid "$VERACODE_API_ID" \
                -vkey "$VERACODE_API_KEY" \
                -action UploadAndScan \
                -appname "$APP_NAME" \
                -createprofile true \
                -autoscan true \
                -filepath verascan \
                -version "$(Build.BuildNumber)-$(System.JobAttempt)"
            displayName: Subir y Escanear (Politica)
            workingDirectory: $(Pipeline.Workspace)/veracode
            env:
              VERACODE_API_ID: $(VERACODE_API_ID)
              VERACODE_API_KEY: $(VERACODE_API_KEY)
